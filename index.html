/* ไหม้เพิ่มจากสูตรสาร: ตัวทำละลาย/น้ำมัน ↑ตามความร้อนผิวใบ · เกลือ ↑ตามความแห้ง (VPD) · จำนวนสาร */
function formBurn(forms,E,TL){if(!forms||!forms.length)return {s:0,why:[]};let s=0;const why=[];const vpd=E&&E.vpdL!=null?E.vpdL:1.5;
 forms.forEach(k=>{const F=FORMS[k];if(!F)return;const h=F.heat*Math.max(0,TL-27)*3.2,sa=F.salt*Math.max(0,vpd-1.2)*7,x=Math.round(Math.min(25,h+sa));if(x>=3){s+=x;why.push(`${fLab(k)}${h>sa?` (ตัวทำละลาย/น้ำมัน ใบ ${fmt(TL,0)}°C)`:` (เกลือเข้มข้นเมื่อแห้ง)`}`)}});
 const n=forms.filter(k=>!NOTPROD(k)).length;if(n>=3){s+=(n-2)*5;why.push(`ผสม ${n} ชนิด`)}
 return {s:Math.min(40,s),why}}
/* ---------- ประโยชน์ต่อพืช % (การพ่น): ขนาดยาถึงเป้า × การดูดซึม × ทนฝน × ไม่ไหม้ × น้ำที่ใช้ผสม ---------- */
const FLOWER_G=['heading','tassel','bud','flower','cflower'];
function sprayBenefit(m,o){const T=m.T,tk=T.key||Object.keys(FLY_TGT).find(k=>FLY_TGT[k]===T)||'fun',E=m.env||{},bio=o.bio;
 const doseT=1-Math.exp(-2.3*m.target/T.D),dose=0.7*doseT+0.3*m.cov;
 const sys=tk==='fol'||tk==='herbS'||!!(bio&&bio.M&&bio.M.sys>=0.5);const up=m.up?m.up.u:0.8;
 let upt=sys?up:0.85+0.15*up,uptN=sys?'ซึมเข้าใบทัน (หยดเปียกนานพอ)':'ซึม/ติดผิวใบ';const ex=[];
 if(bio){if(tk==='fol'&&bio.fab!=null){upt=clampN(bio.fab/0.8,0,1);uptN='ซึมเข้าเซลล์ใน 72 ชม.';ex.push(['ส่งถึง'+SINK_N[bio.B.sink].split(' ')[0].split('/')[0],bio.fdel,'del'])}
  else if(sys)upt=1-Math.pow(1-clampN(up,0,0.999),bio.B.age.cut*bio.adj);
  if(tk!=='herbP')ex.unshift(['ละอองติดใบ',bio.ret,'ret']);
  if((bio.M&&bio.M.sys>=1)||tk==='herbS')ex.push(['พืชกำลังโต (ยาไปทั่วต้น)',clampN(0.4+0.6*bio.act,0,1),'act']);
  if(bio.B.ageK==='none'&&tk!=='herbP')ex.push(['มีใบรับสาร',0.1,'leaf'])}
 const mp=o.mix;let rain=1;if(E.rainSoon)rain=1-0.55*(1-(mp?mp.rain:0.5));if(E.rainNow||E.inv)rain=0;
 const br=o.burn?o.burn.s:0,burnF=1-0.45*br/100;
 let wq=1;if(o.water==='well'&&(tk.startsWith('herb')||(mp&&mp.it.some(x=>x.form==='SL'))))wq*=0.8;if(o.water==='canal'&&tk.startsWith('herb'))wq*=0.7;
 const tot=Math.max(0,dose*upt*rain*burnF*wq*ex.reduce((a,x)=>a*x[1],1));
 return {tot,doseT,cov:m.cov,parts:[[`ยาถึงจุดเป้าหมาย ${Math.round(doseT*100)}% + ทั่วต้น ${Math.round(m.cov*100)}% (รวมแบบ 70:30)`,dose,'dose'],[uptN,upt,'up'],...ex,...(rain<1?[['ไม่ถูกฝนชะ',rain,'rain']]:[]),['ใบไม่ไหม้จากสาร',burnF,'burn'],...(wq<1?[['คุณภาพน้ำผสม',wq,'wq']]:[])]}}
function benefitBox(b,title,tips){const pc=Math.round(b.tot*100),st=pc>=75?'ok':pc>=55?'warn':'bad';
 return `<div class="fben ${st}"><div class="row between"><b>🌿 ${title||'ประโยชน์ต่อพืชโดยรวม'}</b><b class="fben-v">${pc}%</b></div><i class="fbar2"><em style="width:${pc}%"></em></i>
 <div class="fben-p">${b.parts.map(([n,v])=>`<span class="${v<0.6?'neg':v<0.8?'warnc':''}">${esc(n)} <b>${Math.round(v*100)}%</b></span>`).join('<span class="muted">×</span>')}</div>
 ${tipsHTML(tips,b.tot)}<div class="tiny muted">ตัวเลขแต่ละข้อคูณกันได้ค่ารวมด้านบนพอดี — ข้อที่ต่ำสุดคือจุดที่ควรแก้ก่อน</div></div>`}
/* ---------- อันตราย/ผลข้างเคียง ---------- */
function sprayHazards(m,o){const E=m.env||{},H=[];const dr=Math.round(m.drift*100);
 if(dr>=8)H.push([dr>15?'bad':'warn',`💨 ยาปลิวออกนอกแปลง ~${dr}%${o.chemTxt?` (${o.chemTxt})`:''} — เว้นแนวกันชนด้านใต้ลม${dr>15?' ≥10 ม. จากบ้าน/แหล่งน้ำ/แปลงพืชอื่น':' ~5 ม.'}`]);
 if(E.inv)H.push(['bad','🌫️ อากาศผกผัน: ละอองเล็กลอยค้างแล้วไหลไปไกลหลายร้อยเมตร']);
 if(m.evap>0.1)H.push(['warn',`☀️ ละอองระเหยระหว่างตก ~${Math.round(m.evap*100)}% — ไอสารลอยไปกับอากาศ`]);
 if(o.flower&&o.bee)H.push(['bad','🐝 ระยะดอก + สารพิษสูงต่อผึ้ง — พ่นหลังผึ้งเลิกหากิน (หลัง ~18:00) หรือเปลี่ยนกลุ่มสาร']);else if(o.flower&&(o.tgt==='ins'||o.tgt==='deep'))H.push(['warn','🐝 ระยะดอก — เลือกสารที่ปลอดภัยต่อผึ้ง พ่นเย็น']);
 if(o.burn&&o.burn.s>=50)H.push(['bad',`🔥 ใบไหม้จากสาร ${o.burn.lv[1]} (${o.burn.s}/100)`]);
 if(o.w&&o.w<5&&o.tgt==='fol')H.push(['warn','💧 ปุ๋ยทางใบน้ำน้อย = เกลือเข้มข้นต่อหยดสูง']);
 if(E.rainSoon)H.push(['warn',`⏱️ ฝนใน 2 ชม. — สารชุดนี้ต้องแห้ง ~${o.mix?fmt(o.mix.rainH,1):'1–4'} ชม.`]);

/* ---------- 📏 ปรับเทียบจากกระดาษไวน้ำ: วัด บน/กลาง/ล่าง → แก้ % ลงถึงพืช (e) และค่าการลดผ่านชั้นใบ (k) ---------- */
function flyCalCalc(){const f=UI.fly,c=UI.cal||{};if(!f)return null;const ok=x=>x!==''&&x!=null&&!isNaN(parseFloat(x))&&parseFloat(x)>0;
 const env=envOf(flyWx()),tgt=f.tgt||defTgt(f.svc);
 const m=flyModel({crop:f.crop,stg:f.stg,can:f.can,tgt,mob:f.mob,h:f.h,sw:f.sw,w:f.w,d:f.d,wind:f.wind,dt:env.dtE,v:f.v,env,noCal:true});
 const pts=[[0,c.top],[0.5,c.mid],[1,c.bot]].filter(p=>ok(p[1])).map(p=>[p[0],num(p[1])]);
 if(!pts.length)return {err:'กรอกจำนวนจุดอย่างน้อย 1 ระดับ'};
 let kM=m.k,topM;
 if(pts.length>=2){/* ถดถอยกำลังสองน้อยสุด: ln N = ln N₀ − k·LAI·z */
  const zb=pts.reduce((a,p)=>a+p[0],0)/pts.length,yb=pts.reduce((a,p)=>a+Math.log(p[1]),0)/pts.length;let sxy=0,sxx=0;pts.forEach(p=>{sxy+=(p[0]-zb)*(Math.log(p[1])-yb);sxx+=(p[0]-zb)**2});
  const sl=sxx?sxy/sxx:0;kM=Math.max(0.05,-sl/Math.max(0.05,m.lai));topM=Math.exp(yb-sl*zb)}
 else topM=pts[0][1]/Math.exp(-m.k*m.lai*pts[0][0]);
 const e=clampN(topM/Math.max(1,m.top),0.3,2.5),k=clampN(kM/m.k,0.4,2.5);
 return {m,e,k,topM,kM,pts,set:{h:f.h,sw:f.sw,v:f.v,w:f.w,d:f.d,wind:f.wind},crop:f.crop}}
function calResHTML(r){if(r.err)return `<div class="note warn small">${esc(r.err)}</div>`;const m=r.m,meas=z=>{const p=r.pts.find(q=>q[0]===z);return p?Math.round(p[1]):'—'};
 const row=(n,z,pr)=>`<tr><td>${n}</td><td>${Math.round(pr)}</td><td><b>${meas(z)}</b></td><td>${Math.round(r.topM*Math.exp(-r.kM*m.lai*z))}</td></tr>`;
 return `<table class="fm-t"><tr><th>ระดับ</th><th>แบบจำลอง</th><th>วัดได้</th><th>หลังปรับ</th></tr>${row('บน',0,m.top)}${row('กลาง',0.5,m.mid)}${row('ล่าง',1,m.bot)}</table>
 <div class="small" style="margin:6px 0">→ ละอองลงถึงพืชจริง <b>${Math.round(clampN(m.eff*r.e,0.05,0.95)*100)}%</b> (แบบจำลอง ${Math.round(m.eff*100)}% · ×${fmt(r.e,2)}) · การลดผ่านชั้นใบ k จริง <b>${fmt(r.kM,2)}</b> (แบบจำลอง ${fmt(m.k,2)} · ×${fmt(r.k,2)})${r.pts.length<2?' · กรอก ≥2 ระดับ จึงคำนวณ k ได้':''}</div>
 ${r.e<=0.31||r.e>=2.49||r.k<=0.41||r.k>=2.49?'<div class="note warn small">ค่าที่วัดต่างจากแบบจำลองมาก (ถึงขีดจำกัด) — ตรวจการนับจุด/การวางกระดาษ หรือระดับลม ณ ตอนทดสอบ</div>':''}

function trayCalc(){const t=UI.tray||{},s=UI.sp;if(!s)return null;
 const p0=String(t.w||'').split(/[\s,;]+/).map(parseFloat).filter(x=>!isNaN(x)&&x>=0);const sp=num(t.sp)||1,A=num(t.A)||0,ps=Math.max(1,Math.round(num(t.pass)||1));
 if(p0.length<5)return {err:'ต้องมีน้ำหนักอย่างน้อย 5 ถาด'};
 const n=p0.length,p=p0.map(x=>x/ps),xs=p.map((_,i)=>(i-(n-1)/2)*sp),tot=p.reduce((a,b)=>a+b,0);if(!(tot>0))return {err:'น้ำหนักรวมเป็นศูนย์'};
 const f=x=>{const u=x/sp+(n-1)/2;if(u<=-1||u>=n)return 0;const i=Math.floor(u),fr=u-i,a=i>=0?p[i]:0,b=i+1<n?p[i+1]:0;return a+(b-a)*fr};
 /* บินไป-กลับ: เที่ยวคี่กลับทิศ รูปกระจายสะท้อน · บินวนทางเดียว: ไม่สะท้อน */
 const cvAt=(S,bf)=>{const N=80,J=Math.ceil(n*sp/S)+2;let sm=0,sq=0;for(let k=0;k<N;k++){const y=S*(k+0.5)/N;let d=0;for(let j=-J;j<=J;j++){const x=y-j*S;d+=bf&&(j&1)?f(-x):f(x)}sm+=d;sq+=d*d}const mu=sm/N;return Math.sqrt(Math.max(0,sq/N-mu*mu))/mu};
 const ev=spEval(s),cvT=ev.cvT,rows=[];for(let i=0;;i++){const S=Math.round((1+0.05*i)*100)/100;if(S>n*sp+1e-9)break;rows.push({S,bf:cvAt(S,true),rt:cvAt(S,false)})}
 const best=k=>{let b=null;rows.forEach(r=>{if(r[k]<=cvT)b=r});return b};
 const cx=xs.reduce((a,x,i)=>a+x*p[i],0)/tot,sig=Math.sqrt(xs.reduce((a,x,i)=>a+(x-cx)**2*p[i],0)/tot),Lm=sig/0.3615;
 const left=xs.reduce((a,x,i)=>a+(x<0?p[i]:x===0?p[i]/2:0),0)/tot,X0=ev.th.X/(ev.th.cx||1);
 const rateAt=S=>A>0?tot*sp/S/A*16000:null;
 return {n,sp,A,ps,tot,rows,bBF:best('bf'),bRT:best('rt'),b10:(()=>{let b=null;rows.forEach(r=>{if(r.bf<=0.10)b=r});return b})(),minBF:rows.reduce((a,r)=>r.bf<a.bf?r:a,rows[0]),cvT,cx,sig,Lm,left,X0,fx:Lm/X0,S0:num(s.S),cv0:cvAt(num(s.S),true),rate0:rateAt(num(s.S)),rateSet:num(s.rate),mat:ev.m.n,set:{h:s.h,rpm:s.rpm,v:s.v}}}

/* =========================================================
   ส่วนที่ 15: ชีววิทยาใบ/เซลล์พืช — ตามพืช × ระยะใบ × อากาศ
   1) อายุใบ → ความหนาคิวติเคิล (ใบอ่อนคิวติเคิลบาง ซึมเร็วกว่าใบแก่) · กิจกรรมการเติบโต

   3) ปากใบเปิด/ปิดตามแสง + VPD + ภาวะขาดน้ำ
   4) ปุ๋ยทางใบ: เกลือแต่ละชนิดมีจุดดูดความชื้นจนละลาย (POD) และจุดตกผลึก (POE)
      หยดแห้งแล้ว ถ้าความชื้น ≥ POE ยังเป็นของเหลว ซึมต่อ · ถ้าตกผลึกแล้ว ต้องรอความชื้น ≥ POD (กลางคืน) จึงละลายซึมต่อ

   6) สารกำจัดศัตรูพืช: สัมผัส / กินตาย / ซึมผ่านใบ / ดูดซึมท่อน้ำ / ดูดซึมทั่วต้น → เป้าจุดละอองต่างกัน (BASF: ดูดซึม 20–30 · กินตาย 30–50 · สัมผัส 50–70)

   ========================================================= */

/* ชั่วโมงพ่นที่น่าลอง: เช้า 6–9 น. และเย็น 15.30–18 น. ใน 24 ชม. ข้างหน้า */
function tipHours(env,wx){const R=rhModel(env),out=[],keep=(wx.cond||[]).filter(c=>!['hot','part','cloud','night'].includes(c));
 for(let t=1;t<=23;t++){const x=R(t),hr=x.hr;if(!((hr>=6&&hr<=9)||(hr>=15.5&&hr<=18)))continue;const sky=hr<7.5||hr>17?'cloud':'part',dew=x.rh>=95&&hr<9?['wet']:[];/* ความชื้น ≥95% ตอนเช้า = ใบมีน้ำค้าง ละอองรวมตัวไหลทิ้ง */out.push({t0:t,hr,wx:{temp:String(Math.round(x.T*10)/10),rh:String(Math.round(x.rh)),cond:[sky,...dew,...keep.filter(c=>c!=='wet')]},T:x.T,rh:x.rh,dew:!!dew.length})}return out}
/* ข้อจำกัดเชิงชีววิทยาที่ปรับการบิน/เวลาแก้ไม่ได้: หาตัวคูณต่ำสุดหลังทำครบทุกข้อ แล้วบอกเหตุผล + ทางออกจริง */
const ELTH={N:'ไนโตรเจน',P:'ฟอสฟอรัส',K:'โพแทสเซียม',Ca:'แคลเซียม',Mg:'แมกนีเซียม',S:'กำมะถัน',B:'โบรอน',Zn:'สังกะสี',Mn:'แมงกานีส',Fe:'เหล็ก',Cu:'ทองแดง',Cl:'คลอไรด์',Mo:'โมลิบดีนัม'};
function tipLimit(r,bio){if(!r||!r.parts)return null;const p=r.parts.filter(x=>['del','act','leaf','up','ret'].includes(x[2])).sort((a,b)=>a[1]-b[1])[0];if(!p||p[1]>=0.6)return null;
 const k=p[2];let why='';
 if(k==='del'){const sk=bio&&bio.B?bio.B.sink:'',els=bio&&bio.U?[...new Set(bio.U.flatMap(u=>Object.keys(u.el)))].filter(e=>EL[e]&&delivery(e,sk)<0.5):[];
  const sn=sk&&SINK_N[sk]?SINK_N[sk].split(' ')[0].split('/')[0]:'จุดเป้าหมาย';
  why=`${els.length?els.map(e=>ELTH[e]||e).join('/'):'ธาตุในสูตร'}แทบไม่ไหลในท่ออาหาร ส่วนที่ซึมเข้าใบจะค้างอยู่ที่ใบนั้น ไม่ย้ายไป${sn} จึงควรเล็งให้ละอองโดน${sn}โดยตรง พ่นซ้ำตามรอบ และให้ทางดินล่วงหน้าก่อนช่วงนี้เป็นหลัก`}
 else if(k==='up')why='ธาตุ/สารนี้ซึมผ่านผิวใบได้ช้า ส่วนใหญ่ค้างบนผิวใบแล้วแห้งเป็นคราบ — ทางใบเป็นตัวเสริม ไม่ใช่ทดแทนทางดิน: พ่นซ้ำห่าง 7–10 วัน';
 else if(k==='ret')why='ผิวใบมัน/มีไขหรือขนมาก ละอองเด้งหลุด — สารจับใบกลุ่มซิลิโคน (ออร์กาโนซิลิโคน) ช่วยได้มากสุด';
 else if(k==='act')why='ช่วงนี้พืชโตช้า ยาดูดซึมเคลื่อนไปทั่วต้นน้อย — ใช้ยาชนิดสัมผัส หรือรอช่วงแตกใบอ่อน/โตเร็ว';
 else if(k==='leaf')why='ช่วงนี้แทบไม่มีใบรับสาร — เลื่อนไปพ่นเมื่อแตกใบใหม่';
 return {k,n:p[0],v:p[1],why}}
function benefitTips(calc,cur,ctx){const T=[],pc=x=>Math.round(x*100);
 const add=(t,o)=>{try{const r=calc(o);if(r&&r.tot-cur>=0.01)T.push({t,o,to:r.tot,d:r.tot-cur})}catch(e){}};
 if(!ctx.hasAdj&&ctx.bio&&ctx.bio.ret<0.9&&ctx.tk!=='herbP')add(`ใส่สารจับใบ (สารลดแรงตึงผิว) — ละอองติดใบ ${pc(ctx.bio.ret)}% → ~${pc(leafRet(ctx.bio.B,ctx.d||150,1.3))}%`,{addForms:['ADJ'],addAdj:true});
 {let best=null;for(const h of tipHours(ctx.env,ctx.wx)){try{const r=calc({wx:h.wx,t0:h.t0});if(!best||r.tot>best.tot)best={...h,tot:r.tot}}catch(e){}}
  if(best&&best.tot-cur>=0.01)T.push({t:`พ่นช่วง ${String(Math.floor(best.hr)).padStart(2,'0')}:00 น. (คาดอากาศ ~${Math.round(best.T)}°C ความชื้น ${Math.round(best.rh)}%${best.dew?' มีน้ำค้าง':''}) — ใบไม่ร้อน หยดเปียกนานขึ้น`,o:{wx:best.wx,t0:best.t0},to:best.tot,d:best.tot-cur})}
 if(ctx.alt)add(`ใช้ค่าบินโหมดทั่วต้นสูงสุด (น้ำ ${fmt(ctx.alt.w,1)} ล./ไร่ · เร็ว ${spd(ctx.alt.v)} · ละออง ${ctx.alt.d} µm)`,{f:{h:ctx.alt.h,sw:ctx.alt.sw,v:ctx.alt.v,w:ctx.alt.w,d:ctx.alt.d}});
 if(ctx.burnF<0.93&&ctx.w)add(`เพิ่มน้ำเป็น ${fmt(Math.ceil(ctx.w*1.5*2)/2,1)} ล./ไร่ (ใช้ยาเท่าเดิม เจือจางลง ไหม้ยากขึ้น)`,{f:{w:Math.ceil(ctx.w*1.5*2)/2}});
 if(ctx.tk==='fol'&&ctx.bio&&ctx.bio.U.some(u=>u.lh<3)&&!ctx.bio.srcs.includes('urea'))add('ผสมยูเรีย 0.5–1% — ช่วยให้คราบปุ๋ยดูดความชื้น ละลายซึมได้นานขึ้น',{srcs:[...ctx.bio.srcs,'urea']});
 if(ctx.water&&ctx.water!=='tap'&&ctx.water!=='rain')add('ใช้น้ำประปาหรือน้ำฝนผสมแทน (น้ำกระด้าง/น้ำคลองทำให้ยาเสื่อม)',{water:'tap'});
 if(ctx.env&&ctx.env.rainSoon)add('เลื่อนไปพ่นหลังฝนหยุดและใบแห้ง',{wx:{cond:(ctx.wx.cond||[]).filter(c=>c!=='rainSoon')}});
 T.sort((a,b)=>b.d-a.d);const top=T.slice(0,4);let all=null;
 let fin=null;try{fin=calc(top.length?tipMerge(top.map(x=>x.o)):{})}catch(e){}
 if(top.length>1&&fin&&fin.tot>top[0].to+0.005)all=fin.tot;
 return {list:top,all,lim:cur<0.75?tipLimit(fin,ctx.bio):null}}
function tipsHTML(tp,cur){if(!tp||(!tp.list.length&&!tp.lim))return '';const pc=x=>Math.round(x*100);
 return `<div class="ben-tips">${tp.list.length?'<div class="bt-h">💡 ทำแบบนี้ ประโยชน์จะเพิ่มขึ้น</div>':''}${tp.list.map(t=>`<div class="bt"><span>${esc(t.t)}</span><b>${pc(t.to)}%<small>+${Math.max(1,pc(t.d))}</small></b></div>`).join('')}${tp.all?`<div class="bt all"><span>ทำครบทุกข้อด้านบน</span><b>${pc(tp.all)}%<small>+${pc(tp.all-cur)}</small></b></div>`:''}${tp.lim?`<div class="bt lim"><span><b>ข้อจำกัดที่ปรับการบินแก้ไม่ได้: ${esc(tp.lim.n)} ${pc(tp.lim.v)}%</b> — ${esc(tp.lim.why)}</span></div>`:''}</div>`}
/* หน้าแนะนำ: คำนวณใหม่ทั้งชุดด้วยค่าที่เปลี่ยน */
function benAdv(f,wx,o={}){const F2={...f,...(o.f||{})},W2={...wx,...(o.wx||{})},env=envOf(W2),tgt=F2.tgt||defTgt(F2.svc);
 const forms=[...new Set([...(F2.forms||[]),...(o.addForms||[])])],items=forms.map(k=>({form:k,name:'',cat:k==='FOL'||k==='FOLS'?'fer':k==='ADJ'?'adj':''}));
 const _h=x=>x!==''&&x!=null&&!isNaN(parseFloat(x)),dt=_h(W2.temp)&&_h(W2.rh)?deltaT(num(W2.temp),num(W2.rh)):null,water=o.water||F2.water||'tap';
 const md=flyModel({crop:F2.crop,stg:F2.stg,can:F2.can,tgt,mob:F2.mob,h:F2.h,sw:F2.sw,w:F2.w,d:F2.d,wind:F2.wind,dt,v:F2.v,env});
 const mix=mixPlan(items,F2.w,water,[]),burn=burnRisk({crop:F2.crop,stg:F2.stg,tgt,temp:W2.temp,rh:W2.rh,w:F2.w,d:F2.d,env,forms});
 const bio=bioOf({crop:F2.crop,stg:F2.stg,env,d:F2.d,tgt,mob:F2.mob||(md.T&&md.T.mob),srcs:o.srcs||F2.fsrc,hasAdj:forms.includes('ADJ'),R:o.t0!=null?rhModel(envOf(wx)):null,t0:o.t0});
 return sprayBenefit(md,{mix,burn,water,bio})}
function advTips(f,wx,b,bio,md){const tk=md.T.key||f.tgt||defTgt(f.svc),forms=f.forms||[],pf=Object.fromEntries(b.parts.map(p=>[p[2]||'',p[1]]));
 let alt=null;if((pf.dose??1)<0.9&&!(f.lk||[]).length){const cg=CG();try{localStorage.setItem('covGoal','max');const a=flyAdj(f.crop,f.svc,f.can,f.stg,wx,f.tgt,{},f.mob);if(!a.S.spread&&(Math.abs(a.w-f.w)>0.4||Math.abs(a.v-f.v)>0.2))alt=a}catch(e){}finally{try{localStorage.setItem('covGoal',cg)}catch(e){}}}
 return benefitTips(o=>benAdv(f,wx,o),b.tot,{tk,bio,hasAdj:forms.includes('ADJ'),d:f.d,env:envOf(wx),wx,alt,burnF:pf.burn??1,w:f.w,water:f.water||'tap'})}

/* ========== ส่วนที่ 15 (v2): วัสดุที่มี ↔ พื้นที่ · เมล็ดแห้ง→เปียก · น้ำหนักต่อเที่ยว · บันทึกคุมคุณภาพ (QC) ระหว่างหว่าน ==========
   หน่วย 2 แบบ:  "แห้ง"  = น้ำหนักตามกระสอบ → ใช้คิดอัตราเป้า จำนวนเมล็ด ธาตุอาหาร
                 "ในถัง" = น้ำหนักที่โดรนชั่งได้ตอนเติม (เมล็ดแช่/งอก = แห้ง × wf) → ใช้ตั้งอัตราในแอป DJI และบันทึกก่อน/หลังบิน
   wf = (100 − ความชื้นเดิม) ÷ (100 − ความชื้นหลังแช่)  เมล็ดแห้ง ~13% (11–14%) → แช่ ~30% = ×1.24 → งอกตุ่มตา ~33% = ×1.30
   หรือชั่งจริง: เมล็ดแห้ง a กก. แช่/งอก สะเด็ดน้ำแล้วชั่งได้ b กก. → wf = b ÷ a (ล็อตต่างกันดูดน้ำต่างกัน)
   น้ำหนักต่อเที่ยว: สเปก DS80L 55 กก. / 80 ลิตร → ถังเต็มได้จริง = 80 × ความหนาแน่นรวม (กก./ลิตร) → พิกัด = ค่าที่น้อยกว่า
                    ผู้ใช้กำหนดเองให้น้อยกว่าพิกัดได้ (เผื่อปลอดภัย/แบต/ลม)
   บันทึก QC ต่อเที่ยว: ก่อนขึ้นบิน (W0) · หลังลง (W1) · พื้นที่ · ค่าตั้ง · หก/ทิ้ง · นำออกคืนกอง
     จ่ายจริง = W0 − W1 · อัตราจริง = จ่ายจริง ÷ ไร่ · เครื่องคลาด k = Σจ่ายจริง ÷ Σ(ค่าตั้ง × ไร่)
     ค้างถัง = W1(ล่าสุด) − นำออก(ล่าสุด) · คงเหลือในกอง = ที่เตรียมไว้ − Σจ่ายจริง − ค้างถัง − Σหก/ทิ้ง
     อัตราที่ต้องตั้งใหม่ = (กอง + ค้างถัง) ÷ ไร่ที่เหลือ ÷ k */
const SEEDST={soak:{n:'แช่น้ำแล้ว ยังไม่งอก',mc:30},germ:{n:'งอกตุ่มตา 1–2 มม.',mc:33},meas:{n:'ชั่งจริง'}},SEED_MC0=13;
const wfMc=mc=>(100-SEED_MC0)/(100-mc);
const BUD0=()=>({bags:'',kgBag:50,loose:'',s1:'',s2:'',s3:'',res:0,resM:0,per:'',mode:'tgt',plan:'',seedSt:'',mDry:'',mWet:'',bulkKg:'',loadU:'',wState:'',prepD:'',prepAuto:0,au:'rai',am:'cum',log:[],d:{}});
function budMig(b){b={...BUD0(),...(b||{}),mode:'tgt'};b.d=b.d&&typeof b.d==='object'?b.d:{};
 b.log=(b.log||[]).map(x=>x&&x.w0!=null?x:{w0:num(x.kg),w1:0,ra:num(x.rai),rc:null,set:num(x.set)||null,loss:0,ret:0,at:x&&x.at});return b}
function budOf(ctx){if(ctx==='job'){if(typeof F==='undefined'||!F)return BUD0();if(!F.spBud||!F.spBud.d)F.spBud=budMig(F.spBud);return F.spBud}
 const s=UI.sp;if(!s)return BUD0();if(!s.bud){let b=null;try{b=JSON.parse(localStorage.getItem('spBud')||'null')}catch(e){}s.bud=budMig(b&&typeof b==='object'?b:{})}return s.bud}
function budPersist(ctx){if(ctx==='job')return;try{localStorage.setItem('spBud',JSON.stringify(budOf('adv')))}catch(e){}}
const wetable=m=>!!(m&&m.k==='seed'&&m.wetF);
function budSt(b,m){return wetable(m)?(SEEDST[b.seedSt]?b.seedSt:'germ'):'dry'}
function budWFm(b){const d=num(b.mDry),w=num(b.mWet);return d>0&&w>=d&&w<=d*1.8?w/d:null}
function budWF(b,m){const st=budSt(b,m);if(st==='dry')return 1;if(st==='meas')return budWFm(b)||wfMc(SEEDST.germ.mc);return wfMc(SEEDST[st].mc)}
function budBulk(b,m){const k=num(b.bulkKg);return k>=2&&k<=15?k/10:(m?m.bulk:1)}
function budPhysM(ctx,m){const b=budOf(ctx);return {wf:budWF(b,m),bulk:budBulk(b,m),loadU:num(b.loadU)||0}}
/* ---------- วิธีหว่าน + น้ำหนักตามที่ชั่งหน้างาน ----------
   all = หว่านให้หมดพอดีแปลง (ค่าเริ่มต้นเมื่อกรอกจำนวนกระสอบ): ใส่ในแอป = น้ำหนักที่ชั่ง ÷ ไร่ — ไม่ต้องคูณอะไร
   rec = ตามค่าแนะนำ (ค่าแนะนำเป็นเมล็ดแห้ง → ข้าวงอกต้องคูณตัวคูณเปียก) · own = กำหนดเลขที่ใส่ในแอปเอง */
const budTotIn=b=>(num(b.bags)||0)*(num(b.kgBag)||50)+(num(b.loose)||0);

function budMat(ctx){if(ctx==='job')return typeof F!=='undefined'&&F?(spJob(F)||{}).m:null;return UI.sp?MAT[UI.sp.mat]:null}
function budArea(ctx){return ctx==='job'?num(typeof F!=='undefined'&&F?F.area:0):num(UI.sp&&UI.sp.area)}
/* น้ำหนักที่จะเทลงถังทั้งหมด (หักที่กันเผื่อ) ÷ ไร่ → อัตราเมล็ดแห้ง (หน่วยภายในของแอป) */
function budAllD(ctx){const b=budOf(ctx),m=budMat(ctx),A=budArea(ctx),kg=budTotIn(b);if(!m||!(kg>0)||!(A>0))return null;
 const wf=budWF(b,m),asIs=wetable(m)&&b.wState!=='dry',q=BUD_AD[ctx],AD=q&&Math.abs(q.A-A)<1e-9?q.AD:A;return (asIs?kg/wf:kg)/AD}
function budRateD(ctx){return ctx==='job'?(spJob(F)||{}).rate:(UI.sp&&UI.sp.rate)}
function budSetRateD(ctx,v){v=Math.round(v*1000)/1000;if(ctx==='job')budJobRate(v);else if(UI.sp)UI.sp.rate=v}
/* โหมดหว่านให้หมด: ผูกอัตรากับน้ำหนัก/พื้นที่ — การ์ดค่าหว่าน แถบเลื่อน และฟอร์มงาน จะได้เลขเดียวกัน */
function budSync(ctx){const b=budOf(ctx);if(budMode(b,budTotIn(b))!=='all')return false;const v=budAllD(ctx);if(v==null)return false;
 if(Math.abs(num(budRateD(ctx))-v)<0.01)return false;const k=[ctx,budTotIn(b),budArea(ctx),b.wState,b.res,b.resM,b.per,b.mWet,b.mDry,b.seedSt].join('|'),S=budSync._s||(budSync._s={});if(S.k===k&&S.n>=2)return false;S.n=S.k===k?S.n+1:1;S.k=k;budSetRateD(ctx,v);return true}
/* ผู้ใช้กำหนดอัตราเอง (แถบเลื่อน/ช่องอัตราในฟอร์มงาน) → เลิกผูกกับ "หว่านให้หมด" */
function budOwn(ctx){const b=budOf(ctx);if(b.plan==='own')return;b.plan='own';budPersist(ctx);setTimeout(()=>budRefresh(ctx,'full'),0)}
function budPhysSoon(ctx){clearTimeout(budPhysSoon._t);budPhysSoon._t=setTimeout(()=>budPhysRefresh(ctx),250)}
/* ตัวคูณจากเมล็ดแห้ง → น้ำหนักในถัง (ใช้แปลงแถบเลื่อนให้เป็นเลขที่ใส่ในแอป) */
function spWfU(s){return s&&MAT[s.mat]?budPhysM('adv',MAT[s.mat]).wf:1}
/* บรรทัดอธิบายเลข "ใส่ในแอป" บนการ์ดค่าหว่าน */
function budADn(o){return o.AD&&Math.abs(o.AD-o.A)>0.005?` (ที่แอป DJI นับ · แปลง ${fmt(o.A,2)})`:''}
function budHudNote(ctx){try{const b=budOf(ctx),tot=budTotIn(b),mode=budMode(b,tot);if((b.log||[]).length)return '';
 if(mode==='all'){const A=budArea(ctx),m=budMat(ctx);if(!m||!(A>0)||!(tot>0))return '';const wf=budWF(b,m),ns=wetable(m)&&b.wState==='dry',W=ns?tot*wf:tot,q=BUD_AD[ctx],AD=q&&Math.abs(q.A-A)<1e-9?q.AD:A;
  return `“ใส่ในแอป” = ${fmt(W,1)} กก. ÷ ${fmt(AD,2)} ไร่ (หว่านให้หมดพอดีแปลง) · `}
 if(mode==='own')return '“ใส่ในแอป” = ค่าที่กำหนดเอง · ';return ''}catch(e){return ''}}
/* งานเก่า: อัตราในฟอร์มเคยเก็บเป็นเมล็ดแห้ง → แปลงเป็นเลขที่ใส่ในแอป (ครั้งเดียว) */
function budMigJob(J){if(!J||J.kgRaiU||!num(J.kgRai))return;try{const r=spJob(J);J.kgRai=r1(r.hr);J.kgRaiU='tank'}catch(e){}}

 const cmp=()=>{if(!R||!o.rate)return '';const d=o.rate/R.rate-1;

  return `<div class="tiny ${eff?'neg':'muted'}">เทียบค่าแนะนำ: ${wet?`${o.wIn?'ถ้าเป็นข้าวงอก ':''}≈ เมล็ดแห้ง ${fmt(o.rate,1)} กก./ไร่ · ค่าแนะนำ ${fmt(R.rate,1)}`:`${fmt(o.rate,1)} กก./ไร่ · ค่าแนะนำ ${fmt(R.rate,1)}`} (${budPc(d)})${eff}</div>`};
 if(mode==='all'){const Wt=o.useD*wf;
  h+=o.totIn>0&&o.A?`<div class="small">${o.notSoak?`เมล็ดแห้ง ${fmt(o.totD,1)} กก. แช่แล้ว ~${fmt(o.totD*wf,1)} กก.`:`${fmt(o.totIn,1)} กก.`} ÷ ${fmt(o.AD,2)} ไร่${budADn(o)} = <b>${fmt(o.setP,1)} กก./ไร่</b> → ใส่ในแอป</div>${cmp()}`:`<div class="small muted">ใส่พื้นที่ จำนวนกระสอบ และน้ำหนักในข้อ ① ก่อน</div>`}

 else h+=`<div class="bud-in"><label>ใส่ในแอป <input class="spnum" data-bud="ownP" data-ctx="${ctx}" inputmode="decimal" placeholder="กก." value="${o.rate?esc(String(Math.round(o.setP*10)/10)):''}" style="width:64px"> กก./ไร่</label><span class="tiny muted">เช่น ลูกค้าสั่ง</span></div>${cmp()}`;
 if(wet&&(mode==='rec'||o.notSoak)){const st=budSt(b,m),I=(k,w)=>`<input class="spnum" data-bud="${k}" data-ctx="${ctx}" inputmode="decimal" placeholder="กก." value="${esc(String(b[k]??''))}" style="width:${w}px">`;
